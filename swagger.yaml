          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: restaurantID for corresponding menu
          required: true
          schema:
            type: integer
        - name: restaurantUrlID
          in: path
          description: restaurantUrlID of restaurant to get
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Success'
          schema:
            $ref: '#/definitions/GetRestaurantDetailsResponse'
# [PUT] /restaurant - edit a restaurant
    put:
      tags:
        - restaurant
      summary: Edit a restaurant for a user
      description:  Update existing restaurant tied to user. Can be partially updated by including the desired values to update in the request body
      parameters:
