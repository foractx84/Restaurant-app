    post:
      tags:
        - announcements
      summary: Upload/Delete image for announcement
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: restaurant ID for announcement that image is being uploaded to
          required: true
          schema:
            type: integer
        - name: body
          in: body
          description: image to be uploaded and array of ids to be deleted
          required: true
          schema:
            type: object
            description: upload announcement image request body. Contains id of announcement, ids of images to be deleted, and image to upload.
            properties:
              imagesToDelete:
                type: array
                items:
                  type: number
                description: array of ids of restaurant images to be marked as deleted for a restaurant
              announcementID:
                type: number
                description: id of announcement that image will be uploaded/deleted for.
              image:
                type: string
                format: binary
                description: image that is being uploaded for announcement. If a image already exists exception will be thrown.
      responses:
        200:
          description: 'Success - returned if image is successfully inserted'
          schema:
            $ref: '#/definitions/UploadAnnouncementImageResponse'
        204:
          description: 'No Content - returned if only deletion occurs in the request (no insertion takes place). Will have an empty response body'
        401:
          description: 'Unauthorized'
        404:
          description: 'No Content - thrown if provided id to be deleted does not exist for announcement'
        409:
          description: 'Resource Conflict - thrown if image already exists for announcement'
        413:
          description: 'Payload too large - thrown if image provided is over max size limit'
