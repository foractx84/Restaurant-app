# [GET] media - get all media for a restaurant
  /media:
    get:
      tags:
        - media
      summary: get all media from a restaurant's media library sorted by createdAt ASC
      parameters:
        - name: restaurantID
          in: header
          description: restaurant ID for media library
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Success'
          schema:
            type: "array"
            items:
              type: object
              properties:
                mediaID:
                  type: number
                  description: ID of media
                mediaUrl:
                  type: string
                  description: URL of media
                type:
                  type: string
                  description: either "video" or "image"
                createdAt:
                  type: string
                  description: timestamp for creation of media
                name:
                  type: string
                  description: name of the file
        400:
          description: 'Bad Request'
        404:
          description: 'Not Found'
        500:
          description: 'Internal Server Error'
# [POST] media images - upload multiple media images
  /media/images:
    post:
      tags:
        - media
      summary: upload multiple media images to media library
      consumes:
        - multipart/form-data
      parameters:
        - name: restaurantID
          in: header
          description: restaurant ID for media being tied to
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: images
          in: formData
          description: images that are being uploaded of restaurant to the media library
          required: true
          type: array
          items:
            type: file
          collectionFormat: multi
      responses:
        200:
          description: 'Success'
          schema:
            type: "array"
            items:
              type: object
              properties:
                mediaID:
                  type: number
                  description: ID of the uploaded image.
                mediaUrl:
                  type: string
                  description: URL of the uploaded image.
                type:
                  type: string
                  description: defaults to "image" type for this endpoint
                name:
                  type: string
                  description: name of the image file being uploaded
        400:
          description: 'Bad Request'
        404:
          description: 'Not Found'
        500:
          description: 'Internal Server Error'
