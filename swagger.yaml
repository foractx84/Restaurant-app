          required: true
          schema:
            $ref: '#/definitions/ReorderEventMediaBody'
      responses:
        204:
          description: 'No Content'
        400:
          description: 'Bad Request - partial snapshot, duplicate id, or duplicate listOrder'
        404:
          description: 'Not Found - eventMediaID not owned by restaurant'
        500:
          description: 'Internal Server Error'
# [DELETE] event media
  /eventMedia/{eventMediaID}:
    delete:
      tags:
        - events
      summary: Soft-Delete Event Media
      description: Soft-deletes the row and best-effort deletes the underlying GCS object.
      parameters:
        - name: restaurantID
          in: header
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: eventMediaID
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'No Content'
        404:
          description: 'Not Found'
        500:
          description: 'Internal Server Error'

