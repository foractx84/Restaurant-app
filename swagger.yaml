      description:  "If user = manager, then ties the manager via managerID to restaurant via restaurantID.  If user = super user, then just creates the restaurant\n  For restaurantHours, day is the days in the week and can have multiple objects with same day, start and end are military times of hours:mins such as 08:30"
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: body
          in: body
          description: Restaurant Data
          required: true
          schema:
            $ref: '#/definitions/CreateRestaurantRequest'
      responses:
        200:
          description: 'Success'
          schema:
            $ref: '#/definitions/CreateRestaurantResponse'
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        409:
          description: 'Resource Conflict'
        500:
          description: 'Internal Server Error'
 # [GET] restaurant details - get restaurant via restaurantUrlID
    get:
      tags:
        - restaurant
      summary: Get Restaurant via restaurantUrlID
      parameters:
