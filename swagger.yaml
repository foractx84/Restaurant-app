# [GET / POST] event media collection
  /eventMedia:
    get:
      tags:
        - events
      summary: List Event Media
      description: Returns active event media for the restaurant, ordered by list_order ASC.
      parameters:
        - name: restaurantID
          in: header
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Success'
          schema:
            type: array
            items:
              $ref: '#/definitions/EventMediaResponse'
        500:
          description: 'Internal Server Error'
    post:
      tags:
        - events
      summary: Upload Event Media
      description: "Multipart upload. Field `images` accepts up to MAX_EVENT_IMAGES files; field `video` accepts up to MAX_EVENT_VIDEOS (default 1). Both image and video can be sent in the same request; new items are appended after the current highest list_order. Enforces per-restaurant caps."
      consumes:
        - application/form-data
      parameters:
        - name: restaurantID
          in: header
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: images
          in: formData
          description: image files (JPG/PNG)
          required: false
          type: array
          items:
            type: file
        - name: video
          in: formData
          description: video file (MP4/MOV/etc.)
          required: false
          type: array
          items:
            type: file
      responses:
        200:
          description: 'Success'
          schema:
            type: array
            items:
              $ref: '#/definitions/EventMediaResponse'
        400:
          description: 'Bad Request - cap exceeded or invalid file type'
        413:
          description: 'Payload Too Large - file size limit exceeded'
        500:
          description: 'Internal Server Error'
