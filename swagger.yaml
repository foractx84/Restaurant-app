# API path definitions. This spec is consumed by swagger-jsdoc and produced as Swagger 2.0 (OpenAPI 2.0).
# In Swagger 2.0, request bodies are documented with a parameter using 'in: body'. OpenAPI 3.x uses 'requestBody' instead.
paths:
# [POST] stripe checkout
  /stripe/checkout:
    post:
      tags:
        - stripe
      summary: Stripe Create Checkout Session
      description: Endpoint that creates a checkout session for a customer.  Handles both customer already existing via stripe_customer_id in token, and also when customer does not exist for stripe yet.
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: body
          in: body
          description: Stripe Create Checkout Session Data
          required: true
          schema:
            $ref: '#/definitions/StripeCreateCheckoutSessionData'
      responses:
        200:
          description: 'Success - sends back session id.'
          schema:
            type: string
        400:
          description: 'Failure -  invalid request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Either an internal server runtime or database error, or Stripe Exception Error due to stripe create session API failure'
# [GET] stripe customer portal
  /manager/portal:
    get:
      tags:
        - stripe
      summary: Fetch Stripe Customer Portal
      description: Endpoint that retrieves the customer portal for a stripe customer using the managerID contained in the authorization token
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Success - sends back url for stripe customer portal.'
          schema:
            type: string
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found - thrown if manager does not have a stripe customer id'
        500:
          description: 'Internal server runtime error'
# [GET] get stripe checkout session
  /packages/checkout?session={CHECKOUT_SESSION_ID}:
    get:
      tags:
        - stripe
      summary: Fetch Stripe Checkout Session
      description: Endpoint that retrieves the stripe session, and returns the stripeCustomerID, email, and available manager packages of the customer (manager) by managerPackageIDs
      parameters:
        - name: session
          in: query
          description: session id used to retrieve stripe session
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Success - sends back stripeCustomerID, email, and available managerPackageIDs of manager.'
          schema:
            $ref: '#/definitions/GetStripeCheckoutSession'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found - thrown if stripeCustomerID / subscription / subscription item does not exist on stripe session retrieval, or thrown if a subscription or subscription item on stripe session does not exist in database'
        500:
          description: 'Internal server runtime error'
# [POST] stripe webhooks
  /stripe/webhook:
    post:
      tags:
        - webhook
      summary: Stripe Webhook
      description: Endpoint set up to accept Stripe Webhook events
      parameters:
        - name: stripe-signature
          in: header
          description: signature provided from stripe that allows us to construct the stripe events
          required: true
          schema:
            type: string
        - name: payload
          in: body
          required: true
          schema:
            type: object
            description: event payload that contains the data object. Handle event depending on values in payload
      responses:
        200:
          description: 'Success - indicates to stripe that webhook was received.'
        400:
          description: 'Failure - indicates to stripe a failure occurred while processing event'
# [POST] auth
  /login:
    post:
      tags:
        - authorization
      summary: Login Manager
      description: Manager must be verified, if not, then manager must verify their email before proceeding and getting a 200 response
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/loginRequest'
      responses:
        200:
          description: 'Success'
          schema:
            $ref: '#/definitions/LoginResponse'
        500:
          description: 'Internal Server Error'
        401:
          description: 'Unauthorized'
  /forgotPassword:
    post:
      tags:
        - authorization
      summary: Forget Manager's password, send email to reset
      parameters:
      - name: body
        in: body
        description: Manager's Email
        required: true
        schema:
          $ref: '#/definitions/ForgetPassword'
      responses:
        200:
          description: 'Success'
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Internal Server Error'
  /resetPassword:
    post:
      tags:
        - authorization
      summary: Manager sent temp password through email, use temp password and then set new password to login
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequest'
      responses:
        200:
          description: 'Success'
          schema:
            type: object
            properties:
              token:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Internal Server Error'
