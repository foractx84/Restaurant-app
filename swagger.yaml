# [POST] menu item - upload multiple menu item images, video, and thumbnail
  /menuItem/media:
    post:
      tags:
        - menu item
      summary: upload multiple media for menu item
      description: "- Upload menu item media request body. Contains menu item id, images / video / thumbnail to upload, images / video / thumbnail to delete, and images / video to reorder.\n - mediaOrder can contain ids of existing images and vido in string format, as well as filename-N (where N is index of image file being uploaded from images array) and videos-N (n is index of video file being uploaded)\n  i.e. ['2', '4', 'filename-1', 'video-0', '3', '1', 'filename-0']\n - Also, ids of existing images and video for a menu item must be provided in request (unless they are to be deleted in mediaToRemove array), and filename-N and videos-X must have <= uploaded images / video (N <= images.length and X <= video limit -> 1 )\n - Any uploaded images and video not included in the mediaOrder array are by default appeneded to end of the list order\n - mediaOrder must be in string format ['1', '2', 'filename-0', 'videos-0'], while mediaToRemove are numbers -> [1, 2, 3]\n - Videos and thumbnail must be included together to add a video to a menu item.\n - If existing video remains the same but new thumbnail is uploaded, then old thumbnail is soft delted, and new thumbnail replaces old thumbnail.\n - If old video is deleted and new video is uploaded, existing thumbnail is linked to new video"
      consumes:
        - application/form-data
      parameters:
        - name: restaurantID
          in: header
          description: restaurant ID for menu item uploading image for
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: body
          in: body
          description: menu item id, images / video / thumbnail to be uploaded, images / video / thumbnail to be deleted, images / video to be reordered
          required: true
          schema:
            type: object
            description: "upload menu item images / video / thumbnail request body. Contains menu item id, images / video / thumbnail to upload, images / video / thumbnail to delete, and images / video to reorder.\nmediaOrder can contain ids of existing images / video in string format, as well as filename-N and videos-X (where N is index of file being uploaded from images array and X for video)\ni.e. ['2', '4', 'filename-1', 'videos-0', '3', '1', 'filename-0']"
            required:
              - menuItemID
              - images
              - mediaToRemove
              - mediaOrder
              - video
              - thumbnail
            properties:
              menuItemID:
                type: integer
                description: id of the menu item media are being uploaded for
              mediaToRemove:
                type: "array"
                items:
                  type: "number"
                  description: images and video that are being deleted for menu item.
              mediaOrder:
                type: "array"
                items:
                  type: "string"
                  description: images and video that are being reordered for menu item.
              images:
                type: "array"
                items:
                  type: string
                  format: binary
                  description: images that are being uploaded for menu item.
              video:
                type: string
                format: binary
                description: video that is being uploaded for menu item.
              thumbnail:
                type: string
                format: binary
                description: thumbnail that is being uploaded for menu item and tied to video .
      responses:
        200:
          description: 'Success'
          schema:
            type: object
            properties:
              media:
                type: "array"
                items:
                  type: object
                  properties:
                    mediaURL:
                      type: string
                      description: URL of the uploaded image / video.
                    mediaID:
                      type: number
                      description: ID of the uploaded image / video
                    type:
                      type: string
                      description: either 'image' or 'video' type
                    thumbnail:
                      type: object
                      description: empty object for type 'image', object that contains keys below if type 'video'
                      properties:
                        thumbnailID:
                          type: number
                          description: ID of thumbnail
                        thumbnailURL:
                          type: string
                          description: URL of the uploaded thumbnail
        204:
          description: 'No Content'
        400:
          description: 'Bad Request'
        404:
          description: 'Not Found'
        409:
          description: 'Resource Conflict'
        500:
          description: 'Internal Server Error'
