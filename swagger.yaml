        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        409:
          description: 'Resource Conflict'
        500:
          description: 'Internal Server Error'
# [POST] restaurant images - upload images for restaurant
  /restaurant/image:
    post:
      tags:
        - restaurant
      summary: Upload/Delete logo and profile images for restaurant
      description: " - upload restaurant images request body. \n - Contains ids of regular restaurant images profile/logo/thumbnail/menuCover to be deleted and profile/logo/thumbnail/menuCover images to be uploaded.\n - gallery array contains gallery image files to be uploaded.\n - galleryImagesToDelete delete gallery images based on the mediaID of these images returned in the response \n - galleryOrder can contain ids of existing image ids in STRING format, as well as filename-N (where N is index of image file being uploaded from gallery images array)\n  i.e. ['2', '4', 'filename-1', '3', '1', 'filename-0']\n - Also, ids of existing gallery images for a restaurant must be provided in request (unless they are to be deleted in galleryImagesToDelete array), and filename-N must have <= uploaded gallery images  (N <=  gallery.length )\n - Any uploaded images not included in the galleryOrder array are by default appeneded to end of the list order\n - galleryOrder must be in string format ['1', '2', 'filename-0'], while galleryImagesToDelete are numbers -> [1, 2, 3]."
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: restaurant ID for restaurant images are being uploaded to
          required: true
          schema:
            type: integer
        - name: body
          in: body
          description: Profile and logo images to be uploaded and array of ids to be deleted
          required: true
          schema:
            type: object
            description: " - upload restaurant images request body. \n - Contains ids of regular restaurant images profile/logo/thumbnail/menuCover to be deleted and profile/logo/thumbnail/menuCover images to be uploaded.\n - gallery array contains gallery image files to be uploaded.\n - galleryImagesToDelete delete gallery images based on the mediaID of these images returned in the response \n - galleryOrder can contain ids of existing image ids in STRING format, as well as filename-N (where N is index of image file being uploaded from gallery images array)\n  i.e. ['2', '4', 'filename-1', '3', '1', 'filename-0']\n - Also, ids of existing gallery images for a restaurant must be provided in request (unless they are to be deleted in galleryImagesToDelete array), and filename-N must have <= uploaded gallery images  (N <=  gallery.length )\n - Any uploaded images not included in the galleryOrder array are by default appeneded to end of the list order\n - galleryOrder must be in string format ['1', '2', 'filename-0'], while galleryImagesToDelete are numbers -> [1, 2, 3]."
            properties:
              imagesToDelete:
                type: array
                items:
                  type: number
                description: array of ids of restaurant images (non gallery) to be marked as deleted for a restaurant
              logo:
                type: string
                format: binary
                description: image that is being uploaded for logo. If a logo image already exists exception will be thrown.
              thumbnail:
                type: string
                format: binary
                description: image that is being uploaded for thumbnail. If a thumbnail image already exists exception will be thrown.
              menuCover:
                type: string
                format: binary
                description: image that is being uploaded for menuCover. If a menuCover image already exists exception will be thrown.
              profile:
                type: array
                items:
                  type: string
                  format: binary
                  description: image(s) that is being uploaded for profile.  Max limit of 10 images
              gallery:
                type: array
                items:
                  type: string
                  format: binary
                  description: image(s) that is being uploaded for gallery.  Max limit of 15 images
              galleryImagesToDelete:
                type: array
                items:
                  type: number
                description: array of ids of restaurant GALLERY images to be marked as deleted for a restaurant
              galleryOrder:
                type: "array"
                items:
                  type: "string"
                  description: restaurant GALLERY images that are being reordered for restaurant album.
      responses:
        200:
          description: 'Success - returned if images are successfully inserted'
          schema:
            $ref: '#/definitions/UploadRestaurantImagesResponse'
        204:
          description: 'No Content - returned if only deletion occurs in the request (no insertion takes place). Will have an empty response body'
        401:
          description: 'Unauthorized'
        404:
          description: 'No Content - thrown if provided id to be deleted does not exist for restaurant'
        409:
          description: 'Resource Conflict - thrown if provided image type already exists for restaurant'
        413:
          description: 'Payload too large - thrown if image provided is over max size limit'
# [POST] restaurant packages - assign package of manager to restaurant
  /restaurant/package:
    post:
      tags:
        - restaurant
      summary: Assign available package of manager to restaurant
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: update restaurant id description
          required: true
          schema:
            type: integer
        - name: body
          in: body
          description: id of a manager package
          required: true
          schema:
            type: object
            properties:
              managerPackageID:
                type: number
                description: id of manager package to assign to the restaurant.
      responses:
        200:
          description: 'Success'
          schema:
            $ref: '#/definitions/PermissionToken'
        401:
          description: 'Unauthorized'
        404:
          description: 'managerPackageID doesnt exist or is not available for the manager'
        409:
          description: 'Resource Conflict - restaurant already has provided package assigned to it'
# [PUT] restaurant urls - upserts restaurant urls (reservation and ordering) for restaurant
  /restaurant/urls:
    put:
      tags:
        - restaurant
      summary: Upsert restaurant ordering and reservation links
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: restaurant id
          required: true
          schema:
            type: integer
        - name: body
          in: body
          description: Restaurant Data
          required: true
          schema:
            type: object
            description: update restaurant ordering links and reservation links
            properties:
              orderingUrl:
                type: string
                description: url of ordering link of restaurant
              reservationUrl:
                type: string
                description: url of reservation link of restaurant
      responses:
        200:
          description: 'Success'
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
# [PUT] restaurant stripe-connect - link existing Stripe Connect account to restaurant
  /restaurant/stripe-connect:
    put:
      tags:
        - restaurant
      summary: Link existing Stripe Connect account to restaurant
      description: Links an existing Stripe Connect (Standard) account to the restaurant. Used for testing or when attaching an account created outside the app. Restaurant must not already have a Connect account; the Stripe account must not be linked to another restaurant.
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: Restaurant ID to link the Stripe Connect account to
          required: true
          schema:
            type: integer
        - name: body
          in: body
          description: Stripe Connect account ID (e.g. acct_xxx from Stripe Dashboard or API)
          required: true
          schema:
            type: object
            required:
              - stripeAccountId
            properties:
              stripeAccountId:
                type: string
                description: Stripe Connect account ID (Standard account)
      responses:
        200:
          description: 'Success - Stripe Connect account linked to restaurant'
        400:
          description: 'Bad Request - Stripe Connect account not found or not accessible'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found - Restaurant not found'
        409:
          description: 'Resource Conflict - Restaurant already has a Connect account, or Stripe account is already linked to another restaurant'
        500:
          description: 'Internal Server Error'
# [POST] restaurant stripe-connect onboarding-link - get new Stripe Connect onboarding URL
  /restaurant/stripe-connect/onboarding-link:
    post:
      tags:
        - restaurant
      summary: Get Stripe Connect onboarding URL
      description: Returns a new Stripe Connect onboarding URL for the current restaurant. If the restaurant already has a Connect account, returns a fresh account link; otherwise creates the account and returns the first onboarding URL. No request body; restaurant is determined by auth.
      parameters:
        - name: Authorization
          in: header
          description: JWT token used for authentication
          required: true
          schema:
            type: string
        - name: restaurantID
          in: header
          description: Restaurant ID (current context)
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Success - onboarding URL and account ID returned'
          schema:
            type: object
            required:
              - onboarding_url
              - account_id
            properties:
              onboarding_url:
                type: string
                description: Stripe Connect onboarding URL to open in browser
              account_id:
                type: string
                description: Stripe Connect account ID (e.g. acct_xxx)
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found - Restaurant not found'
        500:
          description: 'Internal Server Error - Stripe error or unable to create link'
